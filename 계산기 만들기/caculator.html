<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기본 계산기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calc">
    <div id="display" class="display">0</div>

    <div class="keys">
      <button data-action="clear" class="gray">AC</button>
      <button data-action="sign" class="gray">±</button>
      <button data-action="percent" class="gray">%</button>
      <button data-op="÷" class="op">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="x" class="op">x</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="-" class="op">-</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="+" class="op">+</button>

      <button data-num="0" class="zero">0</button>
      <button data-action="dot">.</button>
      <button data-action="equals" class="op">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
